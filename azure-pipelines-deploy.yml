trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: buildConfiguration
    value: 'Release'

stages:
  # ---------------- BUILD ONCE (.NET 10) ----------------
  - stage: Build
    jobs:
      - job: BuildAndPublish
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '10.x'

          - task: DotNetCoreCLI@2
            displayName: 'Publish AdminSite'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'src/AdminSite/AdminSite.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/AdminSite'
              zipAfterPublish: true

          - task: DotNetCoreCLI@2
            displayName: 'Publish CustomerSite'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'src/CustomerSite/CustomerSite.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/CustomerSite'
              zipAfterPublish: true

          - publish: '$(Build.ArtifactStagingDirectory)'
            artifact: drop

  # ---------------- DEPLOY: POC (auto) ----------------
  - stage: DeployPOC
    dependsOn: Build
    jobs:
      - deployment: DeployToPOC
        environment: 'saas-poc'
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          - group: saas-accelerator-vars          # POC values
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop
                - task: AzureWebApp@1
                  displayName: 'Deploy AdminSite (POC)'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webApp'
                    appName: '$(adminSiteAppName)'
                    package: '$(Pipeline.Workspace)/drop/AdminSite/**/*.zip'
                - task: AzureWebApp@1
                  displayName: 'Deploy CustomerSite (POC)'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webApp'
                    appName: '$(customerSiteAppName)'
                    package: '$(Pipeline.Workspace)/drop/CustomerSite/**/*.zip'

  # ---------------- DEPLOY: PROD (gated by approval on the 'saas-prod' environment) ----------------
  - stage: DeployPROD
    dependsOn: DeployPOC
    jobs:
      - deployment: DeployToPROD
        environment: 'saas-prod'                  # add an Approval check on this environment in ADO
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          - group: saas-accelerator-vars-prod     # PROD values
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop
                - task: AzureWebApp@1
                  displayName: 'Deploy AdminSite (PROD)'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webApp'
                    appName: '$(adminSiteAppName)'
                    package: '$(Pipeline.Workspace)/drop/AdminSite/**/*.zip'
                - task: AzureWebApp@1
                  displayName: 'Deploy CustomerSite (PROD)'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webApp'
                    appName: '$(customerSiteAppName)'
                    package: '$(Pipeline.Workspace)/drop/CustomerSite/**/*.zip'
