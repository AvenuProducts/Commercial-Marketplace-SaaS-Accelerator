trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: saas-accelerator-vars
  - name: buildConfiguration
    value: 'Release'

stages:
  - stage: Build
    jobs:
      - job: BuildAndPublish
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '8.x'

          - task: DotNetCoreCLI@2
            displayName: 'Publish AdminSite'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'src/AdminSite/AdminSite.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/AdminSite'
              zipAfterPublish: true

          - task: DotNetCoreCLI@2
            displayName: 'Publish CustomerSite'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'src/CustomerSite/CustomerSite.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/CustomerSite'
              zipAfterPublish: true

          - publish: '$(Build.ArtifactStagingDirectory)'
            artifact: drop

  - stage: Deploy
    dependsOn: Build
    jobs:
      - deployment: DeployToAzure
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          - group: saas-accelerator-vars   # variable groups don't auto-inherit into deployment jobs — must re-declare here
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureWebApp@1
                  displayName: 'Deploy AdminSite'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webApp'
                    appName: '$(adminSiteAppName)'
                    package: '$(Pipeline.Workspace)/drop/AdminSite/**/*.zip'

                - task: AzureWebApp@1
                  displayName: 'Deploy CustomerSite'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webApp'
                    appName: '$(customerSiteAppName)'
                    package: '$(Pipeline.Workspace)/drop/CustomerSite/**/*.zip'